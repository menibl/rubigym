name: Validate GymFlow changes

on:
  pull_request:
    branches:
      - staging
      - main
  push:
    branches:
      - staging
      - main

permissions:
  contents: read
  actions: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      chat-test-postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gymflow_test
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:55439:5432
        options: >-
          --health-cmd "pg_isready -U gymflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate deployment scripts
        run: |
          for script in deploy/scripts/*.sh deploy/scripts/gymflow-prod deploy/scripts/gymflow-ops; do
            bash -n "$script"
          done

      - name: Test production deployment strict mode
        run: bash deploy/tests/production-deploy.test.sh

      - name: Test server monitor hardening
        run: bash deploy/tests/server-monitor.test.sh

      - name: Test server runtime and OpenClaw resource limits
        run: bash deploy/tests/server-runtime.test.sh

      - name: Test promotion gate
        run: node --test deploy/tests/promotion-gate.test.mjs

      - name: Validate Docker Compose configuration
        env:
          GYMFLOW_ENV_FILE: ${{ github.workspace }}/deploy/.env.example
        run: docker compose --env-file deploy/.env.example -f deploy/compose.yaml config --quiet

      - name: Type-check
        run: pnpm run lint

      - name: Test isolated conversation prototype
        run: pnpm exec tsx --test src/prototype/model.test.ts src/prototype/Conversation.test.tsx src/prototype/integration.test.ts src/prototype/demoAccount.test.ts src/prototype/stagingLogic.test.tsx src/prototype/familyAccountModel.test.tsx src/prototype/familyPlanSteps.test.tsx src/prototype/originalRuntime.test.tsx src/prototype/productionChat.test.ts

      - name: Test original chat client over isolated HTTP and PostgreSQL with fake providers
        run: node scripts/test-chat-original-runtime.mjs 55439 --isolated-postgres

      - name: Test unfinished checkout recovery and production fences with fake providers only
        run: |
          node scripts/test-chat-original-runtime.mjs 55439 --isolated-postgres --strict-provider
          node scripts/test-chat-original-runtime.mjs 55439 --isolated-postgres --strict-provider --individual
          node scripts/test-chat-original-runtime.mjs 55439 --isolated-postgres --strict-provider --production-client
          node scripts/test-chat-original-runtime.mjs 55439 --isolated-postgres --strict-provider --production-client --individual
          node scripts/test-chat-original-runtime.mjs 55439 --isolated-postgres --strict-provider --production-client --production-chat
          node scripts/test-chat-original-runtime.mjs 55439 --isolated-postgres --strict-provider --production-client --production-chat --individual

      - name: Build production bundle
        run: pnpm run build
        env:
          VITE_AI_API_URL: https://staging.invalid
          VITE_PAYMENT_API_URL: https://staging.invalid

      - name: Build opt-in production chat without contacting providers
        run: pnpm run build
        env:
          VITE_CHAT_UI_ENABLED: 'true'
          VITE_AI_API_URL: https://staging.invalid
          VITE_PAYMENT_API_URL: https://staging.invalid

      - name: Validate server entrypoint
        run: node --check server/node-entry.js

      - name: Test server behavior
        run: node --test server/*.test.js

      - name: Build production container
        run: |
          docker build \
            --build-arg VITE_AI_API_URL=https://staging.invalid \
            --build-arg VITE_PAYMENT_API_URL=https://staging.invalid \
            --tag gymflow:ci \
            .

      - name: Validate production runtime dependencies
        run: |
          docker run --rm \
            --entrypoint node \
            gymflow:ci \
            --input-type=module \
            --eval "await import('pg')"

  promotion-gate:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact staging candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require staging as the production source
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: node deploy/scripts/check-promotion.mjs
